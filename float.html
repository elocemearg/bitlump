<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Bitlump Float Explorer</title>
        <meta name="description" content="IEEE 754 floating point explorer" />
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&family=Fira+Sans+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
        <link rel="stylesheet" type="text/css" href="bitlump.css" />
        <link rel="stylesheet" type="text/css" href="float.css" />
    </head>
    <body onload="initPage();">

        <script src="util.js" defer></script>
        <script src="clicktocopy.js" defer></script>
        <script src="binaryint.js" defer></script>
        <script src="floatmain.js" defer></script>

        <noscript>
            <p>
            If you had JavaScript enabled in your browser, this tool might be
            useful to you, but you haven't, so it isn't.
            </p>
        </noscript>

        <main>
            <div class="maininputrow">
                <label class="radiolabel"><input type="radio" name="floatscheme" id="floatscheme32" value="32" checked> Single-precision (32 bit)</label>
                <label class="radiolabel"><input type="radio" name="floatscheme" id="floatscheme64" value="64"> Double-precision (64 bit)</label>
            </div>
            <div class="maininputrow">
                <select id="floatinputformat" class="bigselect">
                    <option value="string">Decimal string</option>
                    <option value="hex">IEEE 754 hex encoding</option>
                </select>
                <input class="floatinput" id="decimalinput" type="text" placeholder="e.g. 1.23456789e-10">
                <input class="floatinput" id="hexinput" type="text" placeholder="e.g. 40490FDB">
            </div>

            <div>
                <div class="mainoutputrow">
                    <div class="mainoutputrowitem">
                        <table class="floatoutput">
                            <tr>
                                <th></th>
                                <th>Sign</th>
                                <th>Exponent</th>
                                <th>Mantissa</th>
                            </tr>
                            <tr>
                                <th>Fields</th>
                                <td class="outputcontainer outputvalue" id="signvalue"></td>
                                <td class="outputcontainer outputvalue" id="exponentvalue"></td>
                                <td class="outputcontainer outputvalue" id="mantissavalue"></td>
                            </tr>
                            <tr>
                                <th>Raw</th>
                                <td class="outputcontainer outputvalue" id="signraw"></td>
                                <td class="outputcontainer outputvalue" id="exponentraw"></td>
                                <td class="outputcontainer outputvalue" id="mantissaraw"></td>
                            </tr>
                            <tr class="nudgebuttons">
                                <td></td>
                                <td></td>
                                <td>
                                    <button id="decrementexponent">-1</button> <button id="incrementexponent">+1</button>
                                </td>
                                <td>
                                    <button id="decrementmantissa">-1</button> <button id="incrementmantissa">+1</button>
                                </td>
                            </tr>
                            <tr>
                                <th>Bits</th>
                                <td id="signbitbuttons"></td>
                                <td id="exponentbitbuttons"></td>
                                <td id="mantissabitbuttons"></td>
                                <td></td>
                            </tr>
                            <tr class="conditions">
                                <th>Conditions</th>
                                <td colspan="3">
                                    <div class="fpcondition fpconditionnegative">Negative</div>
                                    <div class="fpcondition fpconditionzero">Zero</div>
                                    <div class="fpcondition fpconditionsubnormal">Subnormal</div>
                                    <div class="fpcondition fpconditioninfinity">Infinity</div>
                                    <div class="fpcondition fpconditionnan">NaN</div>
                                </td>
                            </tr>
                            <tr>
                                <th></th>
                                <th colspan="3" style="text-align: left;" id="valuehextitle"></th>
                            </tr>
                            <tr>
                                <th></th>
                                <td colspan="3" class="outputcontainer outputvalue outputvaluelarge" id="valuehex"></td>
                            </tr>
                            <tr>
                                <th></th>
                                <th colspan="3" style="text-align: left;" id="valuedecimaltitle">Closest representable value, to <span class="floatformatdigits"></span> decimal digits</th>
                            </tr>
                            <tr>
                                <th></th>
                                <td colspan="3" class="outputcontainer outputvalue outputvaluelarge" id="valuedecimal"></td>
                            </tr>
                        </table>
                    </div>
                </div>
            </div>

        </main>

    </body>
</html>
