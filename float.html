<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Bitlump Float Explorer</title>
        <meta name="description" content="IEEE 754 floating point explorer" />
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&family=Fira+Sans+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
        <link rel="stylesheet" type="text/css" href="bitlump.css" />
        <link rel="stylesheet" type="text/css" href="float.css" />
    </head>
    <body onload="initPage();">

        <script src="util.js" defer></script>
        <script src="binaryint.js" defer></script>
        <script src="floatmain.js" defer></script>

        <noscript>
            <p>
            If you had JavaScript enabled in your browser, this tool might be
            useful to you, but you haven't, so it isn't.
            </p>
        </noscript>

        <main>
            <div class="maininputrow">
                <label><input type="radio" name="floatformat" id="floatformat32" checked> Single-precision (32 bit)</label>
                <label><input type="radio" name="floatformat" id="floatformat64"> Double-precision (64 bit)</label>
            </div>
            <div class="maininputrow">
                Number input
                <input id="decimalinput" type="text">
            </div>
            <div class="maininputrow">
                Hex bit pattern input
                <input id="hexinput" type="text">
            </div>

            <div>
                <div class="mainoutputrow">
                    <div class="mainoutputrowitem">
                        <table class="floatoutput">
                            <tr>
                                <th></th>
                                <th>Sign</th>
                                <th>Exponent</th>
                                <th>Mantissa</th>
                            </tr>
                            <tr>
                                <th>Fields</th>
                                <td class="outputcontainer outputvalue clicktocopy" id="signvalue"></td>
                                <td class="outputcontainer outputvalue clicktocopy" id="exponentvalue"></td>
                                <td class="outputcontainer outputvalue clicktocopy" id="mantissavalue"></td>
                            </tr>
                            <tr>
                                <th>Raw</th>
                                <td class="outputcontainer outputvalue clicktocopy" id="signraw"></td>
                                <td class="outputcontainer outputvalue clicktocopy" id="exponentraw"></td>
                                <td class="outputcontainer outputvalue clicktocopy" id="mantissaraw"></td>
                            </tr>
                            <tr>
                                <th>Bits</th>
                                <td id="signbitbuttons"></td>
                                <td id="exponentbitbuttons"></td>
                                <td id="mantissabitbuttons"></td>
                                <td></td>
                            </tr>
                            <tr>
                                <th>Encoding</th>
                                <td colspan="3" class="outputcontainer outputvalue clicktocopy" id="valuehex"></td>
                            </tr>
                            <tr>
                                <th>Value</th>
                                <td colspan="3" class="outputcontainer outputvalue clicktocopy" id="valuedecimal"></td>
                            </tr>
                        </table>
                    </div>
                </div>
            </div>

        </main>

    </body>
</html>
